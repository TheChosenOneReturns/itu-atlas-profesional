<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" fill="none" role="img" aria-label="crosshair"><style>
    @keyframes spin-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spin-ccw { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    @keyframes pulse-red { 0%, 100% { r: 4px; opacity: 1; filter: drop-shadow(0 0 2px #d52415); } 50% { r: 6.5px; opacity: 0.7; filter: drop-shadow(0 0 8px #ff3826); } }
    @keyframes ping-ring { 0% { r: 6px; opacity: 1; stroke-width: 1.5; } 100% { r: 18px; opacity: 0; stroke-width: 0.5; } }
    @keyframes radar-sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes reticle-bracket { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes glint-flare { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; } 50% { transform: scale(1.15) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 6px #00d2dc); } }
    @keyframes rotor-orbit { 0% { transform: rotate(0deg); } 25% { transform: rotate(90deg); } 50% { transform: rotate(180deg); } 75% { transform: rotate(270deg); } 100% { transform: rotate(360deg); } }
    @keyframes globe-spin { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 80; } }
    @keyframes hazard-blink { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #d52415); } 50% { opacity: 0.4; filter: none; } }
    @keyframes arrow-flow { 0% { transform: translate(0, 0); opacity: 0.4; } 50% { opacity: 1; } 100% { transform: translate(4px, -4px); opacity: 0.4; } }
    @keyframes dash-scroll { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 32; } }

    .bg { fill: #050608; }
    .hud-teal { stroke: #00d2dc; stroke-width: 2; fill: none; }
    .hud-red { stroke: #d52415; stroke-width: 2; fill: none; }
    .hud-white { stroke: #ffffff; stroke-width: 2; fill: none; }
    .txt-tag { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #8c9da0; letter-spacing: 1.5px; }
    .txt-sub { font-family: 'JetBrains Mono', monospace; font-size: 7px; fill: #4b595c; }
    .txt-header { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; fill: #ffffff; letter-spacing: 2px; }

    .anim-spin-cw { transform-origin: center; animation: spin-cw 12s linear infinite; }
    .anim-spin-fast { transform-origin: center; animation: spin-cw 4s linear infinite; }
    .anim-spin-ccw { transform-origin: center; animation: spin-ccw 16s linear infinite; }
    .anim-radar { transform-origin: center; animation: radar-sweep 3s linear infinite; }
    .anim-bracket { transform-origin: center; animation: reticle-bracket 2s ease-in-out infinite; }
    .anim-flare { transform-origin: center; animation: glint-flare 3s ease-in-out infinite; }
    .anim-rotor { transform-origin: center; animation: rotor-orbit 4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; }
    .anim-blink { animation: hazard-blink 1.5s ease-in-out infinite; }
    .anim-pulse-red { animation: pulse-red 1.8s infinite ease-in-out; }
    .anim-ping { animation: ping-ring 1.8s infinite cubic-bezier(0, 0.2, 0.8, 1); transform-origin: center; }
    .anim-arrows { animation: arrow-flow 1.2s ease-in-out infinite alternate; }
    .anim-dash { stroke-dasharray: 4 4; animation: dash-scroll 2s linear infinite; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g class="anim-bracket">
<path class="hud-white" d="M-40 -25 L-40 -40 L-25 -40" stroke-width="2" />
<path class="hud-red" d="M40 -25 L40 -40 L25 -40" stroke-width="2" />
<path class="hud-teal" d="M-40 25 L-40 40 L-25 40" stroke-width="2" />
<path class="hud-teal" d="M40 25 L40 40 L25 40" stroke-width="2" />
</g>

<circle class="anim-spin-cw" cx="0" cy="0" r="28" stroke="#007478" stroke-dasharray="8 4" stroke-width="1.5" />
<circle class="hud-teal" cx="0" cy="0" r="14" stroke-width="1.5" />

<line stroke="#00d2dc" stroke-width="2" x1="-35" x2="-8" y1="0" y2="0" />
<line stroke="#00d2dc" stroke-width="2" x1="8" x2="35" y1="0" y2="0" />
<line stroke="#00d2dc" stroke-width="2" x1="0" x2="0" y1="-35" y2="-8" />
<line stroke="#00d2dc" stroke-width="2" x1="0" x2="0" y1="8" y2="35" />
<circle class="anim-pulse-red" cx="0" cy="0" fill="#d52415" r="3" />
</svg>
