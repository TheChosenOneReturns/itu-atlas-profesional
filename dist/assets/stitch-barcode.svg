<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 96 52" fill="none" role="img" aria-label="barcode"><style>
    @keyframes glitch-slice {
      0%, 85%, 100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
      86% { transform: translate(-4px, 2px); clip-path: inset(15% 0 60% 0); }
      88% { transform: translate(5px, -2px); clip-path: inset(45% 0 20% 0); }
      90% { transform: translate(-3px, 1px); clip-path: inset(70% 0 10% 0); }
      92% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes neon-flicker {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00d2dc); }
      50% { opacity: 0.85; filter: drop-shadow(0 0 12px #00f5ff); }
      75% { opacity: 0.95; filter: drop-shadow(0 0 6px #00d2dc); }
    }
    @keyframes red-flash {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 3px #d52415); }
      50% { opacity: 0.6; filter: drop-shadow(0 0 10px #ff3826); }
    }
    @keyframes strap-shift {
      0% { background-position: 0 0; }
      100% { background-position: 40px 0; }
    }
    @keyframes tape-slide {
      0% { transform: translateX(0); }
      100% { transform: translateX(-30px); }
    }
    @keyframes barcode-scan {
      0% { transform: translateY(-5px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(42px); opacity: 0; }
    }
    @keyframes kinetic-stack {
      0%, 100% { transform: translateX(0); }
      33% { transform: translateX(6px); }
      66% { transform: translateX(-4px); }
    }
    @keyframes led-pulse {
      0%, 100% { fill: #d52415; filter: drop-shadow(0 0 2px #d52415); }
      50% { fill: #ff3826; filter: drop-shadow(0 0 8px #ff3826); }
    }

    .bg { fill: #050608; }
    .txt-heavy { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; }
    .txt-mono { font-family: 'JetBrains Mono', monospace; }
    .txt-stencil { font-family: 'Impact', 'Syne', sans-serif; font-weight: 900; text-transform: uppercase; }

    .anim-glitch { animation: glitch-slice 3.5s infinite; }
    .anim-neon { animation: neon-flicker 2s infinite ease-in-out; }
    .anim-red-flash { animation: red-flash 1.6s infinite ease-in-out; }
    .anim-kinetic-1 { animation: kinetic-stack 4s ease-in-out infinite; }
    .anim-kinetic-2 { animation: kinetic-stack 4s ease-in-out infinite 0.3s; }
    .anim-kinetic-3 { animation: kinetic-stack 4s ease-in-out infinite 0.6s; }
    .anim-barcode-laser { animation: barcode-scan 2s linear infinite; }
    .anim-led { animation: led-pulse 1.2s infinite ease-in-out; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g fill="#ffffff">
<rect height="38" width="2" x="0" y="0" />
<rect height="38" width="4" x="4" y="0" />
<rect height="38" width="1" x="11" y="0" />
<rect height="38" width="3" x="15" y="0" />
<rect height="38" width="5" x="21" y="0" />
<rect height="38" width="2" x="29" y="0" />
<rect height="38" width="4" x="34" y="0" />
<rect height="38" width="1" x="41" y="0" />
<rect height="38" width="6" x="45" y="0" />
<rect height="38" width="2" x="54" y="0" />
<rect height="38" width="5" x="59" y="0" />
<rect height="38" width="3" x="67" y="0" />
<rect height="38" width="4" x="73" y="0" />
<rect height="38" width="2" x="80" y="0" />
</g>

<line class="anim-barcode-laser" stroke="#ff3826" stroke-width="1.8" style="filter: drop-shadow(0 0 4px #d52415);" x1="-5" x2="88" y1="0" y2="0" />
</svg>
